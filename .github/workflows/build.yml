name: Build and Release Bragi

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows beta packages
    runs-on: windows-latest

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Read and validate release version
        id: version
        shell: pwsh
        run: |
          $projectVersion = python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          $tag = "${{ github.ref_name }}"
          $tagVersion = $tag -replace '^v', '' -replace '[-+].*$', ''
          if ($tagVersion -ne $projectVersion) {
            throw "Tag version ($tagVersion) does not match pyproject.toml ($projectVersion)."
          }
          "version=$projectVersion" >> $env:GITHUB_OUTPUT

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "flet==1.0.4" pytest

      - name: Run test suite
        run: python -m pytest -q

      - name: Build Windows application
        shell: pwsh
        run: |
          flet build windows --artifact Bragi --build-version "${{ steps.version.outputs.version }}" --build-number "${{ github.run_number }}"
          if (-not (Test-Path "build/windows/Bragi.exe")) {
            Get-ChildItem build/windows -Recurse | Select-Object FullName
            throw "Expected build/windows/Bragi.exe was not produced."
          }

      - name: Build Windows installer
        shell: pwsh
        run: |
          iscc "/DAppVersion=${{ steps.version.outputs.version }}" installer.iss
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE."
          }

      - name: Create portable ZIP
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $zipPath = "build/Bragi-$version-Windows-x64.zip"
          Compress-Archive -Path "build/windows/*" -DestinationPath $zipPath -CompressionLevel Optimal -Force
          if (-not (Test-Path $zipPath)) {
            throw "Portable ZIP was not created."
          }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Bragi v${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            build/installer/Bragi-${{ steps.version.outputs.version }}-setup.exe
            build/Bragi-${{ steps.version.outputs.version }}-Windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "Bragi"
version = "0.2.0"
description = "Universal Fretboard, Pitch Detection & Ear Training Suite"
authors = [{ name = "Arthur Belanger" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flet>=0.22.0",
    "pydantic>=2.5.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "sounddevice>=0.4.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

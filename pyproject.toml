[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "Bragi"
version = "0.2.0"
description = "Universal Fretboard, Pitch Detection & Ear Training Suite"
authors = [{ name = "Arthur Belanger" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flet==1.0.4",
    "pydantic>=2.5.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "sounddevice>=0.4.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.flet]
org = "com.runicaudio"
product = "Bragi"
company = "RunicAudio"
copyright = "Copyright (C) 2026 Arthur Belanger"
icon_background = "#282A36"
permissions = ["microphone"]

[tool.flet.app]
path = "src"
module = "main"
